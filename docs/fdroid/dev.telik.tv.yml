Categories:
  - Multimedia
  - System
License: GPL-3.0-only
AuthorName: Andrew Komkov
WebSite: https://andrewkomkov.github.io/telik/
SourceCode: https://github.com/andrewkomkov/telik
IssueTracker: https://github.com/andrewkomkov/telik/issues
Changelog: https://github.com/andrewkomkov/telik/releases

AutoName: Telik

RepoType: git
Repo: https://github.com/andrewkomkov/telik.git

Builds:
  - versionName: 2.0.2
    versionCode: 18
    commit: v2.0.2
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake ninja-build
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - rustup@stable
    prebuild: $$rustup$$/rustup-init.sh -y --default-toolchain 1.98.0 --target armv7-linux-androideabi
    scandelete:
      - app/src/main/cpp/third_party/libplist/fuzz
    build:
      - source $HOME/.cargo/env
      - ANDROID_HOME=$$SDK$$ ANDROID_NDK_HOME=$$NDK$$ ../scripts/build-remote.sh
    ndk: 27.0.12077973

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/build.gradle.kts|getOrElse\((\d+)\)|app/build.gradle.kts|versionName
  = "(.*)"
CurrentVersion: 2.0.2
CurrentVersionCode: 18
